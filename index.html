<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#efebe3" />
    <meta name="description" content="Приглашение на воскресенье, 18 октября" />
    <title>Воскресенье, 21:30</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #efebe3;
        --paper: #fbf9f4;
        --ink: #1c1a17;
        --muted: #77716a;
        --line: #d9d3c7;
        --accent: #e0492b;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        color: var(--ink);
        font-family: var(--sans);
        background: var(--bg);
        overflow-x: hidden;
      }

      .ticket {
        position: relative;
        width: min(400px, 100%);
        background: var(--paper);
        border-radius: 18px;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04), 0 18px 40px -18px rgba(40, 30, 20, 0.35);
        animation: rise 0.7s cubic-bezier(.2,.8,.2,1) both;
      }

      .top { padding: 26px 24px 24px; }

      .meta {
        display: flex;
        justify-content: space-between;
        margin: 0 0 34px;
        color: var(--muted);
        font: 500 11px/1 var(--mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .meta b { color: var(--accent); font-weight: 600; }

      h1, h2 {
        margin: 0;
        font-family: var(--serif);
        font-weight: 400;
        letter-spacing: -0.02em;
      }

      h1 { font-size: clamp(38px, 11vw, 48px); line-height: 1.02; }
      h1 em { font-style: italic; color: var(--accent); }

      .lead {
        margin: 16px 0 0;
        max-width: 300px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.5;
      }

      .perf {
        position: relative;
        height: 0;
        border-top: 2px dashed var(--line);
        margin: 0 18px;
      }

      .perf::before, .perf::after {
        content: "";
        position: absolute;
        top: -13px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--bg);
      }

      .perf::before { left: -31px; }
      .perf::after { right: -31px; }

      .details {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        padding: 20px 24px;
      }

      .details div + div { padding-left: 14px; border-left: 1px solid var(--line); }

      .details dt {
        margin-bottom: 6px;
        color: var(--muted);
        font: 500 10px/1 var(--mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .details dd { margin: 0; font-size: 17px; font-weight: 600; }
      .details dd small { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; font-weight: 400; }

      .bottom { padding: 4px 24px 26px; }

      .actions {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        align-content: start;
        min-height: 54px;
      }

      button {
        border: 0;
        font: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      .btn {
        min-height: 54px;
        padding: 0 18px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        transition: transform 0.15s ease, background 0.15s ease;
      }

      .btn:active { transform: scale(.98); }

      #yesBtn { color: var(--paper); background: var(--ink); }
      #yesBtn:hover { background: #000; }

      #noBtn {
        color: var(--ink);
        background: transparent;
        box-shadow: inset 0 0 0 1.5px var(--line);
      }

      #noBtn:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }

      .hint {
        margin: 14px 0 0;
        color: var(--muted);
        font: 400 11px/1.4 var(--mono);
        text-align: center;
      }

      /* шаги поверх билета */
      .step {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 28px 24px;
        border-radius: 18px;
        background: var(--paper);
        opacity: 0;
        visibility: hidden;
        transform: translateY(8px);
        transition: opacity .35s ease, transform .35s ease, visibility .35s;
      }

      .step.show { opacity: 1; visibility: visible; transform: none; }

      .step h2 { font-size: clamp(32px, 9vw, 40px); line-height: 1.05; }

      .done-text { margin: 16px 0 0; color: var(--muted); font-size: 16px; line-height: 1.55; }
      .done-text b { color: var(--ink); font-weight: 600; }

      .stamp {
        align-self: flex-start;
        margin-bottom: 26px;
        padding: 8px 14px;
        border: 2.5px solid var(--accent);
        border-radius: 8px;
        color: var(--accent);
        font: 700 14px/1 var(--mono);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        transform: rotate(-6deg);
      }

      .step.show .stamp { animation: stamp .45s cubic-bezier(.3,1.6,.5,1) .15s both; }

      @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
      @keyframes stamp { from { opacity: 0; transform: rotate(-6deg) scale(1.8); } }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="ticket">
      <section class="top">
        <p class="meta"><span>Приглашение</span><b>№ 002</b></p>
        <h1>Свободна<br />в воскресенье <em>вечером?</em></h1>
        <p class="lead">План уже есть. Не хватает только тебя.</p>
      </section>

      <div class="perf" aria-hidden="true"></div>

      <dl class="details">
        <div><dt>Дата</dt><dd>18.10<small>воскресенье</small></dd></div>
        <div><dt>Время</dt><dd>21:30<small>строго</small></dd></div>
        <div><dt>Формат</dt><dd>?<small>сюрприз</small></dd></div>
      </dl>

      <section class="bottom">
        <div class="actions" id="actions">
          <button class="btn" id="yesBtn" type="button">Да</button>
          <button class="btn" id="noBtn" type="button">Нет</button>
        </div>
        <p class="hint">кнопка «да» сегодня не в настроении</p>
      </section>

      <section class="step" id="declined" aria-live="polite" aria-hidden="true">
        <span class="stamp">Отклонено</span>
        <h2>Ладно.</h2>
        <p class="done-text">
          <b>Грустнооооо.</b><br />
          Хорошо.<br />
          Ушёл.
        </p>
      </section>
    </main>

    <script>
      const noButton = document.querySelector('#noBtn');
      const declined = document.querySelector('#declined');

      noButton.addEventListener('click', () => {
        declined.classList.add('show');
        declined.setAttribute('aria-hidden', 'false');
      });
    </script>
  </body>
</html>
